      - "${MAIL_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${MAIL_DB_URL}"
      - "SERVICE_PORT=${MAIL_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='mail_service'"
    volumes:
      - ./services/mail-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
