    expose:
      - "${POST_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${POST_DB_URL}"
      - "SERVICE_PORT=${POST_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='post_service'"
      - "MEILISEARCH_KEY=${MEILISEARCH_KEY}"
    volumes:
      - ./services/post-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
