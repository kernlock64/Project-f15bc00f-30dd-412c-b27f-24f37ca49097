services:

  master:
    image: chrislusf/seaweedfs
    expose:
      - 9333
      - 19333
      - 9324
    networks:
      - seaweed
    command: 'master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324'
    restart: always

  volume:
    image: chrislusf/seaweedfs
    expose:
      - 8080
      - 18080
      - 9325
    networks:
      - seaweed
    command: 'volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325'
    depends_on:
      - master
    restart: always

  vector:
    image: timberio/vector:0.34.X-alpine
    container_name: vector
    networks:
      - internal
    expose:
      - 8686
    restart: always
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_buffer:/var/lib/vector
    depends_on:
      - clickhouse

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    networks:
      - internal
    expose:
      - 8123
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=123
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./initial.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  filer:
    image: chrislusf/seaweedfs
    expose:
      - 8888
      - 18888
      - 9326
    networks:
      - internal
      - seaweed
    command: 'filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume
    restart: always

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: URBAN-DB
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d init_db" ]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: init_db
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  # =====DEBUG=FOR=MAIL-SERVICE=====
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: always
    networks:
      - internal
  # =====DEBUG=FOR=MAIL-SERVICE=====

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "${DB_PASSWORD}"
    restart: always
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: search-engine
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:7700/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - MEILI_LOG_LEVEL=ERROR
      - MEILI_MASTER_KEY=$MEILISEARCH_KEY
      - MEILI_NO_ANALYTICS=true
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT}:${MEILISEARCH_PORT}"
    volumes:
      - meilidata:/var/lib/meilidata/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal


  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "127.0.0.1:${AUTH_PORT}:${AUTH_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${AUTH_DB_URL}"
      - "SERVICE_PORT=${AUTH_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='auth_service'"
      - "SECRET_KEY=${SECRET_KEY}"
      - "PUBLIC_KEY=${PUBLIC_KEY}"
      - "PUB=${AUTH_PUB}"
      - "SUB=${AUTH_SUB}"
    volumes:
      - ./services/auth-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  favourite-service:
    build:
      context: .
      dockerfile: services/favourite-service/Dockerfile
    expose:
      - "${FAVOURITE_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${FAVOURITE_DB_URL}"
      - "SERVICE_PORT=${FAVOURITE_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='favourite_service'"
      - "SUB=${FAVOURITE_SUB}"
    volumes:
      - ./services/favourite-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    ports:
      - "127.0.0.1:${ADMIN_PORT}:${ADMIN_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${ADMIN_DB_URL}"
      - "SERVICE_PORT=${ADMIN_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SECRET_KEY=${SECRET_KEY}"
      - "MEDIA_KEY=${MEDIA_KEY}"
      - "SERVICE_NAME='admin_service'"
      - "PUB=${ADMIN_PUB}"
      - "SUB=${ADMIN_SUB}"
    volumes:
      - ./services/admin-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  mail-service:
    build:
      context: .
      dockerfile: services/mail-service/Dockerfile
    expose:
      - "${MAIL_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${MAIL_DB_URL}"
      - "SERVICE_PORT=${MAIL_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='mail_service'"
    volumes:
      - ./services/mail-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  media-service:
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    ports:
      - "127.0.0.1:${MEDIA_PORT}:${MEDIA_PORT}"
    networks:
      - internal
    volumes:
      - ./services/media-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    environment:
      - "PYTHONPATH=."
      - "SERVICE_PORT=${MEDIA_PORT}"
      - "SERVICE_NAME='media_service'"
      - "MEDIA_KEY=${MEDIA_KEY}"
      - "SUB=${MEDIA_SUB}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  post-service:
    build:
      context: .
      dockerfile: services/post-service/Dockerfile
    expose:
      - "${POST_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${POST_DB_URL}"
      - "SERVICE_PORT=${POST_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='post_service'"
      - "MEILISEARCH_KEY=${MEILISEARCH_KEY}"
      - "MEDIA_KEY=${MEDIA_KEY}"
      - "PUB=${POST_PUB}"
      - "SUB=${POST_SUB}"
    volumes:
      - ./services/post-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    expose:
      - "${USER_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${USER_DB_URL}"
      - "SERVICE_PORT=${USER_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='user_service'"
      - "MEDIA_KEY=${MEDIA_KEY}"
      - "SUB=${USER_SUB}"
    volumes:
      - ./services/user-service:/service
      - /app/venv/
      - /app/__pycache__/
      - ./services/shared:/service/shared
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

networks:
  internal:
    driver: bridge
  seaweed:
    driver: bridge

volumes:
  postgres_data:
  meilidata:
  vector_buffer:
  ch_data: