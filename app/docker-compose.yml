    expose:
      - "${MEDIA_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${MEDIA_DB_URL}"
      - "SERVICE_PORT=${MEDIA_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
