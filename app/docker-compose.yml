version: '3.8'

services:

  master:
    image: chrislusf/seaweedfs
    expose:
      - 9333
      - 19333
      - 9324
    networks:
      - seaweed
    command: 'master -ip=master -ip.bind=0.0.0.0 -metricsPort=9324'
    restart: always

  volume:
    image: chrislusf/seaweedfs
    expose:
      - 8080
      - 18080
      - 9325
    networks:
      - seaweed
    command: 'volume -ip=volume -master="master:9333" -ip.bind=0.0.0.0 -port=8080 -metricsPort=9325'
    depends_on:
      - master
    restart: always

  filer:
    image: chrislusf/seaweedfs
    expose:
      - 8888
      - 18888
      - 9326
    networks:
      - internal
      - seaweed
    command: 'filer -ip=filer -master="master:9333" -ip.bind=0.0.0.0 -metricsPort=9326'
    tty: true
    stdin_open: true
    depends_on:
      - master
      - volume
    restart: always

  db:
    image: postgres:15
    container_name: URBAN-DB
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d init_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: init_db
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

# =====DEBUG=FOR=MAIL-SERVICE=====
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: always
    networks:
      - internal
# =====DEBUG=FOR=MAIL-SERVICE=====

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "${DB_PASSWORD}"
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: search-engine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      - MEILI_MASTER_KEY=$MEILISEARCH_KEY
      - MEILI_NO_ANALYTICS=true
    ports:
      - "${MEILISEARCH_PORT}:${MEILISEARCH_PORT}"
    volumes:
      - meilidata:/var/lib/meilidata/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal


  auth-service:
    build: ./services/auth-service
    ports:
      - "${AUTH_PORT}:${AUTH_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${AUTH_DB_URL}"
      - "SERVICE_PORT=${AUTH_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='auth_service'"
      - "SECRET_KEY=${SECRET_KEY}"
      - "PUBLIC_KEY=${PUBLIC_KEY}"
    volumes:
      - ./services/auth-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
      db:
        condition: service_healthy
    restart: always

  favourite-service:
    build: ./services/favourite-service
    expose:
      - "${FAVOURITE_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${FAVOURITE_DB_URL}"
      - "SERVICE_PORT=${FAVOURITE_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='favourite_service'"
    volumes:
      - ./services/favourite-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin-service:
    build: ./services/admin-service
    expose:
      - "${ADMIN_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${ADMIN_DB_URL}"
      - "SERVICE_PORT=${ADMIN_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='admin_service'"
    volumes:
      - ./services/admin-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
      db:
        condition: service_healthy
    restart: always

  mail-service:
    build: ./services/mail-service
    expose:
      - "${MAIL_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${MAIL_DB_URL}"
      - "SERVICE_PORT=${MAIL_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='mail_service'"
    volumes:
      - ./services/mail-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
      db:
        condition: service_healthy
    restart: always

  media-service:
    build: ./services/media-service
    ports:
      - "${MEDIA_PORT}:${MEDIA_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "SERVICE_PORT=${MEDIA_PORT}"
      - "SERVICE_NAME='media_service'"
      - "MEDIA_KEY=${MEDIA_KEY}"
    restart: always

  post-service:
    build: ./services/post-service
    expose:
      - "${POST_PORT}"
    networks:
      - internal
    environment:
      - "PYTHONPATH=."
      - "DATABASE_URL=${POST_DB_URL}"
      - "SERVICE_PORT=${POST_PORT}"
      - "DB_USER=${DB_USER}"
      - "DB_PASSWORD=${DB_PASSWORD}"
      - "DB_PORT=${DB_PORT}"
      - "DB_HOST=${DB_HOST}"
      - "SERVICE_NAME='post_service'"
      - "MEILISEARCH_KEY=${MEILISEARCH_KEY}"
      - "MEDIA_KEY=${MEDIA_KEY}"
    volumes:
      - ./services/post-service:/service
      - /app/venv/
      - /app/__pycache__/
    depends_on:
      db:
        condition: service_healthy
    restart: always

