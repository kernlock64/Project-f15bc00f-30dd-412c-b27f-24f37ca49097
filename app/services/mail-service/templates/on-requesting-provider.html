<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #E9EDEE; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #E9EDEE; padding: 50px 20px;">
    <tr>
        <td align="center">

            <table width="100%" border="0" cellspacing="0" cellpadding="0"
                   style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border: 1px solid #d1d5db;">


                <tr>
                    <td style="padding: 0; line-height: 0; font-size: 0;">
                        <img src="cid:logo_image"
                             width="600"
                             alt="Wide Banner"
                             style="display: block; width: 100%; height: auto; border: 0; border-radius: 16px 16px 0 0;">
                    </td>
                </tr>


                <tr>
                    <td style="padding: 48px 40px; text-align: center;">
                        <h1 style="color: #1e293b; font-size: 26px; font-weight: 700; margin: 0 0 16px 0; letter-spacing: -0.02em;">
                            Здравствуйте, {{ username }}!
                        </h1>

                        <p style="color: #475569; font-size: 16px; line-height: 1.6; margin: 0 0 32px 0;">
                            Мы получили ваш запрос на создание учётной записи. В ближайшее время, с вами свяжется наш менеджер.
                        </p>


                        <div style="margin: 48px 0 24px 0; border-top: 1px solid #f1f5f9;"></div>
                        <p style="color: #94a3b8; font-size: 12px; line-height: 1.5; margin: 0;">
                            Это письмо было отправлено автоматически. Пожалуйста, не отвечайте на него.
                        </p>
                    </td>
                </tr>
            </table>

            <p style="color: #64748b; font-size: 11px; margin-top: 30px; text-align: center; text-transform: uppercase; letter-spacing: 1px;">
                &copy; 2026 Айсберг Маркет &bull; Сочи, Россия
            </p>
        </td>
    </tr>
</table>
</body>
</html>
