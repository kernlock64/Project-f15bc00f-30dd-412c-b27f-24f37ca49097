version: '3.8'

services:
  db:
    image: postgres:15
    container_name: URBAN-DB
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d init_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: init_db
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  auth-service:
    build: ./services/auth
    ports:
      - "5000:5000"
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://admin:pass@postgres-core:5432/auth_db
    depends_on:
      db:
        condition: service_healthy
    restart: always

  favourite-service:
    build: ./services/auth
    expose:
      - "5001"
    networks:
      - internal
    environment:
      - DATABASE_URL=postgresql://admin:pass@postgres-core:5432/auth_db
