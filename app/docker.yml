version: '3.8'

services:
  db:
    image: postgres:15
    container_name: URBAN-DB
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d init_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - ${DB_PORT}:${DB_PORT}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: root_db
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: search-engine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl", "-f", "http://localhost:5431"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - ${MEILISEARCH_PORT}:${MEILISEARCH_PORT}
    volumes:
      - meilidata:/var/lib/meilidata/data
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - internal


  auth-service:
    build: ./services/auth
    ports:
      - ${AUTH_PORT}:${AUTH_PORT}
    networks:
      - internal
    environment:
      - DATABASE_URL=${AUTH_DB_URL}
      - SERVICE_PORT=${AUTH_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD={DB_PASSWORD}
      - DB_PORT={DB_PORT}
      - DB_HOST={DB_HOST}
      - SERVICE_NAME="auth_service"
    command:
      - ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: always

  favourite-service:
    build: ./services/auth
    expose:
      - ${FAVOURITE_PORT}
    networks:
      - internal
    environment:
      - DATABASE_URL=${AUTH_DB_URL}
      - SERVICE_PORT=${AUTH_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD={DB_PASSWORD}
      - DB_PORT={DB_PORT}
      - DB_HOST={DB_HOST}
      - SERVICE_NAME="favourite_service"
    command:
      - ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: always

  admin-service:
    build: ./services/auth
    expose:
      - ${ADMIN_PORT}
    networks:
      - internal
    environment:
      - DATABASE_URL=${AUTH_DB_URL}
      - SERVICE_PORT=${AUTH_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD={DB_PASSWORD}
      - DB_PORT={DB_PORT}`
      - DB_HOST={DB_HOST}
      - SERVICE_NAME="admin_service"
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    restart: always

  com-service:
